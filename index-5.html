<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrielle vs Gabriel 🧟</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #421044, #09070d 55%, #020204);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

header {
  text-align: center;
  margin-bottom: 18px;
}

header h1 {
  margin: 5px 0;
  font-size: clamp(30px, 8vw, 58px);
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow: 0 0 20px #a000ff;
}

header p {
  color: #bbb;
  margin: 5px;
}

.arena {
  position: relative;
  min-height: 480px;
  border: 2px solid #702080;
  border-radius: 22px;
  overflow: hidden;
  background:
    linear-gradient(to bottom, transparent 55%, rgba(0,0,0,.8)),
    radial-gradient(circle at 30% 30%, #35134c, transparent 25%),
    radial-gradient(circle at 75% 30%, #4a101b, transparent 25%),
    #08080d;
  box-shadow: 0 0 40px rgba(150,0,255,.25);
}

.moon {
  position: absolute;
  width: 100px;
  height: 100px;
  background: #ddd;
  border-radius: 50%;
  top: 35px;
  left: calc(50% - 50px);
  box-shadow: 0 0 35px #fff;
  opacity: .8;
}

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100px;
  background:
    repeating-linear-gradient(
      90deg,
      #17131c 0px,
      #17131c 30px,
      #211725 31px,
      #211725 32px
    );
  border-top: 3px solid #3c243f;
}

.fighter {
  position: absolute;
  bottom: 85px;
  width: 140px;
  text-align: center;
  transition: .15s;
}

.fighter.adrielle {
  left: 8%;
}

.fighter.gabriel {
  right: 8%;
}

.character {
  font-size: 100px;
  filter: drop-shadow(0 10px 8px #000);
  transition: .15s;
}

.name {
  font-weight: bold;
  font-size: 20px;
  text-shadow: 0 2px 4px #000;
}

.life-area {
  margin: 10px auto;
  width: 140px;
  height: 18px;
  border: 2px solid white;
  background: #22000a;
  border-radius: 10px;
  overflow: hidden;
}

.life {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #00ff55, #b6ff00);
  transition: width .3s;
}

.gabriel .life {
  margin-left: auto;
}

.attack {
  animation: attack .25s;
}

.hit {
  animation: hit .25s;
}

@keyframes attack {
  50% {
    transform: scale(1.25) translateX(25px);
  }
}

@keyframes hit {
  50% {
    transform: translateX(-15px) rotate(-8deg);
    filter: brightness(3);
  }
}

.controls {
  margin-top: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.control-box {
  background: rgba(15,15,20,.9);
  padding: 15px;
  border-radius: 18px;
  border: 1px solid #38263d;
}

.control-box h2 {
  text-align: center;
  font-size: 16px;
  margin-top: 0;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 8px;
  color: white;
  background: linear-gradient(#63247c, #351242);
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 #19091f;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #19091f;
}

.special {
  background: linear-gradient(#c42d77, #70103d);
}

.defend {
  background: linear-gradient(#286d91, #12394e);
}

.message {
  text-align: center;
  min-height: 32px;
  margin: 18px 0;
  font-size: 20px;
  font-weight: bold;
  color: #ffd65c;
}

#restart {
  display: none;
  margin: 0 auto 20px;
  background: linear-gradient(#e73c45, #7d0b12);
  font-size: 18px;
  padding: 15px 30px;
}

@media(max-width:600px) {
  .arena {
    min-height: 400px;
  }

  .fighter {
    width: 110px;
  }

  .fighter.adrielle {
    left: 2%;
  }

  .fighter.gabriel {
    right: 2%;
  }

  .character {
    font-size: 75px;
  }

  .life-area {
    width: 105px;
  }

  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div>🧟‍♀️ ⚔️ 🧟</div>
  <h1>Zombie Fight</h1>
  <p>Adrielle vs Gabriel</p>
</header>

<div class="arena">

  <div class="moon"></div>
  <div class="ground"></div>

  <div class="fighter adrielle" id="adrielle">
    <div class="life-area">
      <div class="life" id="lifeAdrielle"></div>
    </div>
    <div class="character" id="charAdrielle">🧟‍♀️</div>
    <div class="name">ADRiELLE</div>
  </div>

  <div class="fighter gabriel" id="gabriel">
    <div class="life-area">
      <div class="life" id="lifeGabriel"></div>
    </div>
    <div class="character" id="charGabriel">🧟</div>
    <div class="name">GABRIEL</div>
  </div>

</div>

<div class="message" id="message">
  A batalha começou! 💀
</div>

<div class="controls">

  <div class="control-box">
    <h2>🧟‍♀️ ADRIELLE</h2>

    <div class="buttons">
      <button onclick="attack('adrielle', 'gabriel', 8)">
        👊 SOCO
      </button>

      <button onclick="attack('adrielle', 'gabriel', 12)">
        🦵 CHUTE
      </button>

      <button class="special" onclick="attack('adrielle', 'gabriel', 22)">
        ⚡ ESPECIAL
      </button>

      <button class="defend" onclick="defend('adrielle')">
        🛡️ DEFESA
      </button>
    </div>
  </div>

  <div class="control-box">
    <h2>🧟 GABRIEL</h2>

    <div class="buttons">
      <button onclick="attack('gabriel', 'adrielle', 8)">
        👊 SOCO
      </button>

      <button onclick="attack('gabriel', 'adrielle', 12)">
        🦵 CHUTE
      </button>

      <button class="special" onclick="attack('gabriel', 'adrielle', 22)">
        ⚡ ESPECIAL
      </button>

      <button class="defend" onclick="defend('gabriel')">
        🛡️ DEFESA
      </button>
    </div>
  </div>

</div>

<button id="restart" onclick="restartGame()">
  🔥 LUTAR NOVAMENTE
</button>

</div>

<script>

let life = {
  adrielle: 100,
  gabriel: 100
};

let defending = {
  adrielle: false,
  gabriel: false
};

let gameOver = false;

function attack(attacker, target, damage) {

  if (gameOver) return;

  if (defending[attacker]) {
    defending[attacker] = false;
  }

  if (defending[target]) {
    damage = Math.floor(damage / 2);
    defending[target] = false;
    showMessage(
      target.toUpperCase() + " bloqueou parte do ataque! 🛡️"
    );
  }

  life[target] -= damage;

  if (life[target] < 0) {
    life[target] = 0;
  }

  animateAttack(attacker);
  animateHit(target);
  updateLife();

  if (life[target] <= 0) {
    finishGame(attacker, target);
  } else {
    showMessage(
      attacker.toUpperCase() +
      " atacou causando " +
      damage +
      " de dano! 💥"
    );
  }
}

function defend(player) {

  if (gameOver) return;

  defending[player] = true;

  showMessage(
    player.toUpperCase() + " entrou em posição de defesa! 🛡️"
  );
}

function updateLife() {

  document.getElementById("lifeAdrielle").style.width =
    life.adrielle + "%";

  document.getElementById("lifeGabriel").style.width =
    life.gabriel + "%";
}

function animateAttack(player) {

  const element =
    document.getElementById("char" +
    capitalize(player));

  element.classList.remove("attack");

  void element.offsetWidth;

  element.classList.add("attack");

  setTimeout(() => {
    element.classList.remove("attack");
  }, 300);
}

function animateHit(player) {

  const element =
    document.getElementById("char" +
    capitalize(player));

  element.classList.remove("hit");

  void element.offsetWidth;

  element.classList.add("hit");

  setTimeout(() => {
    element.classList.remove("hit");
  }, 300);
}

function capitalize(text) {

  return text.charAt(0).toUpperCase() +
         text.slice(1);
}

function showMessage(text) {

  document.getElementById("message").textContent = text;
}

function finishGame(winner, loser) {

  gameOver = true;

  showMessage(
    "💀 FATALITY! " +
    winner.toUpperCase() +
    " VENCEU! 🏆"
  );

  document.getElementById("restart").style.display = "block";
}

function restartGame() {

  life.adrielle = 100;
  life.gabriel = 100;

  defending.adrielle = false;
  defending.gabriel = false;

  gameOver = false;

  updateLife();

  document.getElementById("restart").style.display = "none";

  showMessage("A batalha começou novamente! ⚔️");
}

updateLife();

</script>

</body>
</html>
